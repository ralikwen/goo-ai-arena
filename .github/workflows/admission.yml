name: Data admission

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to recheck
        required: true
        type: string

permissions: {}

concurrency:
  group: arena-request-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name != 'issue_comment' || (github.event.issue.pull_request && github.event.comment.body == '/arena recheck')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out trusted platform code, never the PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install trusted checker dependencies on this disposable runner
        run: |
          python3 -m pip install --disable-pip-version-check jsonschema==4.26.0
          npm install --prefix "$RUNNER_TEMP/arena-decoder" --ignore-scripts --no-audit --no-fund playwright@1.58.2
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/arena-browsers" "$RUNNER_TEMP/arena-decoder/node_modules/.bin/playwright" install chromium
      - name: Read the PR as data and pin its complete Git tree
        env:
          GH_TOKEN: ${{ github.token }}
          ARENA_PR_NUMBER: ${{ inputs.pr_number }}
        run: python3 -B -m arena_platform.ci prepare --output "$RUNNER_TEMP/arena-input"
      - name: Check data without a GitHub token in the process environment
        env:
          NODE_PATH: ${{ runner.temp }}/arena-decoder/node_modules
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/arena-browsers
        run: python3 -B -m arena_platform.ci check --input "$RUNNER_TEMP/arena-input" --output "$RUNNER_TEMP/arena-result/result.json"
      - name: Retain full structured feedback
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: admission-result
          path: ${{ runner.temp }}/arena-result/result.json
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: check
    if: always() && needs.check.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      statuses: write
      actions: read
    steps:
      - name: Check out the same trusted platform revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install the trusted JSON Schema implementation
        run: python3 -m pip install --disable-pip-version-check jsonschema==4.26.0
      - name: Receive only the result JSON from this run
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: admission-result
          path: ${{ runner.temp }}/arena-result
      - name: Publish checked blobs and receipt atomically, or report correction/pending
        env:
          GH_TOKEN: ${{ github.token }}
          ARENA_PR_NUMBER: ${{ inputs.pr_number }}
        run: python3 -B -m arena_platform.ci publish --input "$RUNNER_TEMP/arena-result/result.json" --output "$RUNNER_TEMP/arena-publication/publication.json"
      - name: Retain the publication outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: publication-result
          path: ${{ runner.temp }}/arena-publication/publication.json
          if-no-files-found: warn
          retention-days: 30
